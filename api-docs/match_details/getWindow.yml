info:
  name: getWindow
  type: http
  seq: 1
  tags:
    - match_details

http:
  method: GET
  url: "{{baseUrl}}/window/:gameId"
  params:
    - name: gameId
      value: ""
      type: path
      description: |
        The game id of the match
    - name: startingTime
      value: ""
      type: query
      description: |
        The date-time (RFC3339)
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: https://feed.lolesports.com/livestats/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Successful request
    request:
      url: "{{baseUrl}}/window/:gameId"
      method: GET
      params:
        - name: gameId
          value: ""
          type: path
          description: |
            The game id of the match
        - name: startingTime
          value: ""
          type: query
          description: |
            The date-time (RFC3339)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "esportsGameId": "",
            "esportsMatchId": "",
            "gameMetadata": {
              "patchVersion": "",
              "blueTeamMetadata": {
                "esportsTeamId": "",
                "participantMetadata": []
              },
              "redTeamMetadata": {
                "esportsTeamId": "",
                "participantMetadata": []
              }
            },
            "frames": []
          }

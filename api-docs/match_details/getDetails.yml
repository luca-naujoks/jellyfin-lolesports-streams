http:
  method: GET
  url: "{{baseUrl}}/details/:gameId"
  params:
    - name: startingTime
      value: ""
      type: query
      description: |
        The date-time (RFC3339)
      disabled: true
    - name: participantIds
      value: ""
      type: query
      description: |
        A list of the participant Ids separated by underscores and not commas
      disabled: true
    - name: gameId
      value: "115548147900684649"
      type: path
      description: |
        The game id of the match

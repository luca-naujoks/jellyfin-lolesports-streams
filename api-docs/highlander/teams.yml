info:
  name: teams
  type: http
  seq: 6
  tags:
    - highlander

http:
  method: GET
  url: "{{baseUrl}}/teams"
  params:
    - name: slug
      value: ""
      type: query
      description: The team slug.
    - name: tournament
      value: ""
      type: query
      description: The tournament ID.
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: https://api.lolesports.com/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


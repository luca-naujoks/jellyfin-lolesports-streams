info:
  name: highlanderTournaments
  type: http
  seq: 3
  tags:
    - highlander

http:
  method: GET
  url: "{{baseUrl}}/highlanderTournaments"
  params:
    - name: league
      value: ""
      type: query
      description: The id of the league you want details of
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: https://api.lolesports.com/api/v2

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


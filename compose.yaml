services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:12
    container_name: jellyfin-dev
    ports:
      - "8096:8096"
    volumes:
      - ./dev/jellyfin/config:/config
      - ./dev/jellyfin/cache:/cache
    environment:
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.containers.internal:host-gateway"
    restart: unless-stopped
  jellyBridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: jellybridge:latest
    container_name: jellyBridge
    volumes:
      - ./dev/bridge:/app/db
    restart: unless-stopped
    ports:
      - "9000:80"